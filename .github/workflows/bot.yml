name: Send Price Update

on:
  schedule:
    # هر ۳۰ دقیقه یک‌بار اجرا می‌شود (زمان‌بندی به وقت UTC است)
    - cron: "*/30 * * * *"
  workflow_dispatch: {}   # امکان اجرای دستی از تب Actions

jobs:
  send-price:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          ALANCHAND_API_TOKEN: ${{ secrets.ALANCHAND_API_TOKEN }}
        run: python main.py
